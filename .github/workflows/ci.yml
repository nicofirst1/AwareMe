# Continuous integration for AwareMe.
#
# Mirrors the local gates (typecheck / jest / expo lint / design-token lint) on
# a fresh clone
# of the repo. The workflow assumes nothing about the machine it runs on: no
# private content, no local paths, no secrets. Files that are gitignored
# locally never exist here, and the suite is expected to be green without them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: typecheck, jest, lint, design-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # Official gitleaks action; rules live in .gitleaks.toml (default
        # set, no allowlists). Full history is scanned (baseline 2026-09-23:
        # 245 commits, zero leaks); any finding fails the job before the
        # install steps run.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Plain `npm ci` fails: it auto-installs peer dependencies that the
        # legacy-peer-deps resolution intentionally omits (measured 2026-09-23:
        # react-native-gesture-handler, react-native-reanimated, react-dom and
        # ~40 more would enter the tree, flipping expo's native autolinking).
        # The flag gives a clean-room install, exactly from the lockfile
        # (docs/DECISIONS.md, environment quirks).
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest

      - name: Lint
        # Baseline is 0 errors and 13 warnings. Warnings do not fail the run;
        # any error does (default eslint exit behaviour).
        run: npx expo lint

      - name: Design tokens lint
        # Validates docs/design/DESIGN.md (Google design.md format, ADR-0006)
        # against the spec: structure, section order, broken token refs, WCAG
        # contrast pairs. Baseline is 0 errors / 83 warnings; warnings do not
        # fail the run, any error does (exit code 1).
        run: npm run design:lint
